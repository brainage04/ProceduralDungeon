plugins {
    id 'io.github.brainage04.fabric-mod-conventions' version "${fabricmoddingconventions_version}"
    id 'io.github.brainage04.client-gametest-recorder' version "${fabricmoddingconventions_version}"
    id 'io.github.brainage04.production-gametests' version "${fabricmoddingconventions_version}"
    id 'io.github.brainage04.workspace-dependencies' version "${fabricmoddingconventions_version}"
    id 'io.github.brainage04.mod-publishing' version "${fabricmoddingconventions_version}"
}
base { archivesName = rootProject.archives_base_name }
sourceSets {
    gametest {
        java.srcDir project(':common').file('src/gametest/java')
    }
}
loom {
    accessWidenerPath = project.file('src/main/resources/procedural_dungeon.accesswidener')
    mods { main { sourceSet sourceSets.main; sourceSet project(':common').sourceSets.main } }
}
configurations { common { canBeResolved = true; canBeConsumed = false }; compileClasspath.extendsFrom common; runtimeClasspath.extendsFrom common; developmentFabric.extendsFrom common }
workspaceDependencies { siblingMaven('FabricModdingConventions') { coordinate.set("io.github.brainage04:fabricmoddingconventions:${project.fabricmoddingconventions_version}"); siblingDirectory.set(rootProject.layout.projectDirectory.dir('../FabricModdingConventions')) } }
fabricApi {
    configureDataGeneration {
        client = false
        outputDirectory.set(project(':common').layout.projectDirectory.file('src/main/generated'))
        addToResources = false
    }
}
clientGameTestRecorder { runDir.set(layout.buildDirectory.dir('run/productionClientGameTest')); guiScale.set('3') }
tasks.named('recordClientGameTest') { runTaskName.set('runProductionClientGameTest') }
tasks.named('prepareClientGameTestRun') { mustRunAfter('prepareProductionGameTestRuns') }
tasks.matching { it.name == 'runProductionClientGameTest' }.configureEach { dependsOn('prepareClientGameTestRun') }
modPublishing {
    github.repository.set('brainage04/ProceduralDungeon')
    licenseFile.set(rootProject.layout.projectDirectory.file('LICENSE'))
    modrinth.projectConfig.set(rootProject.layout.projectDirectory.file('.modrinth/project.json'))
    modrinth.projectBody.set(rootProject.layout.projectDirectory.file('README.md'))
    modrinth.iconFile.set(rootProject.layout.projectDirectory.file('common/src/main/resources/assets/procedural_dungeon/icon.png'))
}
productionGameTests { includeServer = true; includeClient.set(true); clientUseXvfb.set(providers.environmentVariable('GTR_RECORDING_MANAGED_XVFB').map { !it.toBoolean() }.orElse(true)) }
dependencies {
    common(project(':common')) { transitive = false }
}
tasks.named('jar') { from project(':common').sourceSets.main.output; duplicatesStrategy = DuplicatesStrategy.EXCLUDE }
tasks.named('sourcesJar') {
    from project(':common').sourceSets.main.allSource
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
tasks.matching { it.name.startsWith('run') }.configureEach { dependsOn project(':common').tasks.named('jar') }
