plugins {
    id 'dev.architectury.loom-no-remap'
    id 'dev.architectury.loom'
    id 'io.github.brainage04.mod-publishing' version "${fabricmoddingconventions_version}"
}
base { archivesName = "${rootProject.archives_base_name}-neoforge" }
modPublishing {
    version.set("${rootProject.mod_version}-neoforge")
    releaseTag.set("v${rootProject.mod_version}")
    displayName.set("${rootProject.mod_name} ${rootProject.mod_version} (NeoForge)")
    modLoaders.set(['neoforge'])
    fabricModJson.set(rootProject.layout.projectDirectory.file('fabric/build/resources/main/fabric.mod.json'))
    github.repository.set('brainage04/ProceduralDungeon')
    licenseFile.set(rootProject.layout.projectDirectory.file('LICENSE'))
    modrinth.projectConfig.set(rootProject.layout.projectDirectory.file('.modrinth/project.json'))
    modrinth.projectBody.set(rootProject.layout.projectDirectory.file('README.md'))
    modrinth.iconFile.set(rootProject.layout.projectDirectory.file('common/src/main/resources/assets/procedural_dungeon/icon.png'))
}
tasks.named('validateModPublication') { dependsOn ':fabric:processResources' }
sourceSets {
    gametest {
        java.srcDir project(':common').file('src/gametest/java')
        compileClasspath += sourceSets.main.output + configurations.compileClasspath
        runtimeClasspath += output + compileClasspath + configurations.runtimeClasspath
    }
}
loom {
    neoForge { accessTransformer file('src/main/resources/META-INF/accesstransformer.cfg') }
    mods { main { sourceSet sourceSets.main; sourceSet project(':common').sourceSets.main; sourceSet sourceSets.gametest } }
    runs {
        client { runDir 'run/client' }
        gameTestServer { server(); forgeTemplate 'gameTestServer'; name 'NeoForge Game Tests'; source sourceSets.gametest; runDir 'run/gametest' }
    }
}
configurations { common { canBeResolved = true; canBeConsumed = false }; compileClasspath.extendsFrom common; runtimeClasspath.extendsFrom common }
dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"
    common(project(':common')) { transitive = false }
}
tasks.named('jar') {
    from project(':common').sourceSets.main.output
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(rootProject.file('LICENSE')) { rename { "${it}_${rootProject.archives_base_name}-neoforge" } }
}
tasks.named('sourcesJar') { from project(':common').sourceSets.main.allSource }
tasks.matching { it.name.startsWith('run') }.configureEach { dependsOn project(':common').tasks.named('jar') }
